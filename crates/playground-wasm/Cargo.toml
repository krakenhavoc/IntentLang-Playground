[package]
name = "playground-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
intent-parser = { git = "https://github.com/krakenhavoc/IntentLang.git", branch = "docs/phase7-updates" }
intent-check = { git = "https://github.com/krakenhavoc/IntentLang.git", branch = "docs/phase7-updates" }
intent-render = { git = "https://github.com/krakenhavoc/IntentLang.git", branch = "docs/phase7-updates" }
intent-ir = { git = "https://github.com/krakenhavoc/IntentLang.git", branch = "docs/phase7-updates" }
intent-runtime = { git = "https://github.com/krakenhavoc/IntentLang.git", branch = "docs/phase7-updates", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
